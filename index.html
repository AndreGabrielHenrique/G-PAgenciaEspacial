<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Define a codificação de caracteres para UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Define o ícone da página (favicon) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Configura o viewport para responsividade, garantindo que a largura seja igual à largura do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Meta descrição para SEO e informações sobre a página -->
    <meta name="description" content="Agência Espacial da G&P, ainda em construção então é puramente acadêmico." />
    <!-- Título da página exibido na aba do navegador -->
    <title>G&P Agência Espacial</title>
  </head>
  <body>
    <!-- Div raiz onde o aplicativo React será renderizado -->
    <div id="root"></div>
    <!-- Script principal que inicia o aplicativo React (utilizando Vite) -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
